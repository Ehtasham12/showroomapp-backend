# fly.toml app configuration file generated for showroomapp-backend on 2026-11-03T15:48:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'showroomapp-backend'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
